services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: study_guide
      POSTGRES_PASSWORD: study_guide_dev_password
      POSTGRES_DB: study_guide
    ports:
      - "5432:5432"
    volumes:
      - study_guide_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_guide -d study_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  study_guide_pg_data:
